# factory.toml 예시. 실제 파일은 gitignored다. 키는 환경변수 이름으로만 적는다.
# 모델 이름과 수치는 전부 제안값이다(docs/status/decisions.md).

[providers.text]
adapter = "openai_compat"
base_url = "http://127.0.0.1:10100/v1"
model = "gpt-6.1-sol"
api_key_env = "ACF_TEXT_API_KEY"

[providers.judge]
adapter = "openai_compat"
base_url = "http://127.0.0.1:10100/v1"
model = "anthropic/claude-opus-5-5"
api_key_env = "ACF_TEXT_API_KEY"

[budget]
max_calls_per_command = 200
max_cost_usd_per_command = 20.0

[stages.s7]
max_check_retries = 3

[stages.s8]
short_prompt_max_chars = 2400  # 섹션 예산 합계(1550) + 시스템 규칙·출력 규칙·헤더 여유
# 긴 프롬프트의 시스템 규칙 원문 경로 (Q-0006). 비우면 내장 기본 규칙(resources/system-rules-default-v1.md)을 쓴다.
system_rules_path = ""

# S1 미리보기 이미지. ChatGPT 구독으로 Codex 내장 이미지 생성을 쓴다(D-0019). API 키가 필요 없다.
# Codex CLI가 ChatGPT 계정으로 로그인돼 있어야 한다. 테스트·데모는 adapter = "fake".
[providers.image]
adapter = "codex_image"
model = "gpt-6.1-sol"
reasoning_effort = "low"
timeout_s = 600

# S1 기본값은 D-0018 제안, G1은 외모군마다 얼굴 한 장이다(D-0043 (1)).
[stages.s1]
cluster_k = 4
min_members_per_cluster = 3
min_common_fields = 2
previews_per_cluster = 1   # 외모군마다 얼굴 1장. 다시 만들기는 acf ref faces(D-0043 (2))
max_check_retries = 3
image_size = "1024x1024"
min_list_size_for_percentile = 3

# S1 순위 자동 수집(acf ref collect, D-0044 (4)). 출처 조사: docs/research/2026-10-27-ranking-sources.md
# 출처는 랭키파이(robots 허용, 사람 확인 필요). 분류마다 10명이라 성별 하나로 쓰면 목록이 10명뿐이다.
# cluster_k = 4, min_members_per_cluster = 3은 12명 이상이 필요하므로, 수집 목록을 쓸 때는
# cluster_k = 3으로 낮추거나 여러 달 목록을 합친다(K-0035).
[stages.s1.collect]
categories = ["idolFemale", "idolMale"]   # actor(혼성)는 characterGender = "any"에서만 쓴다
user_agent = "acf-rankings/0.1 (+character-factory PoC; polite crawl)"
min_interval_s = 5.0
timeout_s = 20.0
retries = 2
backoff_s = 2.0

# S2 기준 사진(D-0042, D-0043 (6)). 사람 관문 없이 자동으로 외모 명세를 고정한다.
# picked: G1에서 고른 얼굴을 그대로 기준 이미지로 쓴다(이미지·판정 호출 0회).
# generate: 기준 사진 생성 + identity-v1 동일인 검사. 이번 PoC 범위 밖이므로 실행 전에 거절하고
#           picked를 안내한다(K-0034). LLD §3의 문서상 기본값은 generate지만 PoC는 picked로 돌린다.
[stages.s2]
base_photo = "picked"
image_size = "1024x1024"


# S5 소개 영상(D-0028). 어댑터는 xai_video(공식 API, 유료) / grok_web(웹, 기본 꺼짐) / fake.
# 이 절이 없으면 fake다. 실제 호출은 --execute와 사용자 지시가 있을 때만 한다.
[providers.video]
adapter = "xai_video"
model = "grok-imagine-video-1.5-lite"  # 720p 1초 $0.03 + 입력 이미지 $0.01 (2026-10-21 공식 단가)
api_key_env = "XAI_API_KEY"
poll_interval_s = 5
timeout_s = 600
# 단가가 바뀌면 덮어쓴다. 모델 → 해상도 → 1초당 USD. 입력 이미지 $0.01은 따로 더한다.
# [providers.video.price_per_second."grok-imagine-video-1.5-lite"]
# "480p" = 0.02
# "720p" = 0.03

# grok_web은 xAI 이용 정책(봇·스크립트 접근 금지) 위반 위험을 감수하고 켠다(D-0029).
# 준비 절차는 `acf video web-setup`이 안내한다. 쓰려면 위 절 대신 아래를 쓴다.
# [providers.video]
# adapter = "grok_web"
# accept_terms_risk = true
# cdp_url = "http://127.0.0.1:9222"
# imagine_url = "https://grok.com/imagine"
# timeout_s = 600
# 웹 화면은 길이 6/10/15초, 해상도 480p/720p만 고를 수 있다. 무료 등급은 480p·6초만 되고
# 영상 1편 뒤 결제 창이 떴다(2026-10-21, D-0032). 웹을 쓸 때는 [stages.s5]를 duration = 6, resolution = "480p"로 둔다.
# 화면 선택자는 2026-10-21 한국어 UI에 맞춘 기본값이 있다. 화면이 바뀌면 [providers.video.selectors]로 덮어쓴다
# (키: video_mode, option, audio, upload, uploaded, prompt, submit).

# grok_oauth는 같은 xAI 영상 API를 opencodex의 xAI OAuth 로그인 토큰으로 부른다(D-0044 (3)).
# 토큰을 Bearer로 받는지, 이용 조건에 맞는지는 실제 호출 전 미확인이다. 토큰 값은 출력·기록하지 않는다.
# [providers.video]
# adapter = "grok_oauth"
# model = "grok-imagine-video-1.5-lite"
# base_url = "https://api.x.ai/v1"
# token_file = "~/.opencodex/auth.json"    # 활성 xAI 계정의 credential.access
# # token_env = "XAI_OAUTH_ACCESS_TOKEN"   # 있으면 token_file보다 먼저 쓴다
# poll_interval_s = 5
# timeout_s = 600

# S5 기본값은 D-0030 제안이다. 후보 2편 × 8초 × 720p, 소리 없음.
# 비율은 쇼츠용 9:16이다(D-0031). 대표 이미지를 참조로 세로 첫 프레임을 [providers.image]로 한 장 만들어 자른다.
[stages.s5]
candidates = 2
duration = 8
resolution = "720p"
generate_audio = false
aspect_ratio = "9:16"
first_frame = "vertical"  # "hero"면 대표 이미지를 그대로 첫 프레임으로 쓴다(비율도 대표 이미지를 따름)

# S6 동작 영상(D-0038, D-0040 확정, D-0041 제안값). G4에서 승인한 챕터 완성 이미지를 미소 출발 첫 프레임으로 쓴다.
# 이름은 앱 통화 영상 clip_key다(src/acf/stages/s6_actions/app_clips.py). 무표정 출발(_bad) 영상이 있으면
# 챕터마다 G4 이미지의 표정만 바꾼 무표정 사진을 1장 만든다. 웹(grok_web)이면 resolution = "480p"로 둔다.
[stages.s6]
preset = "l2"          # l2 = 챕터마다 6편(idle_good, idle_bad, glad_good, amused_good, shy_good, sorry_good), standard = 앱 표준 37편
actions = []           # 비우지 않으면 preset 대신 이 목록(app_clips.py에 있는 clip_key만)
candidates = 1         # 동작마다 후보 수
resolution = "720p"
aspect_ratio = "9:16"
generate_audio = false

[stages.s6.durations]  # 초. Grok은 6·10·15초를 고를 수 있다. 앱 대기 영상은 20초지만 Grok 최대가 15초다
idle = 15
emotion = 10
special = 6

# 기획·장면 흐름(D-0033~D-0035). 변형 3안, 배경·자세 후보 챕터당 3개, 완성 이미지 챕터당 1장은 확정(D-0034).
[stages.s3]
variants = 3
max_check_retries = 3

# 참고 자료 선별. 색인이 없으면 S3r은 건너뛴다. 색인은 원문을 담으므로 Git 밖 경로에 둔다(Q-0019).
# [resources] 표에 reference_index = "/abs/path/refs-index.json"을 넣는다(acf refs index로 만든다).
[stages.s3r]
top_k = 8
max_selected = 8

[stages.s4a]
candidates_per_chapter = 3
plates = true
aspect_ratio = "9:16"

[stages.s4b]
candidates_per_chapter = 3

[stages.s4]
aspect_ratio = "9:16"
reference_crop = "face"
face_crop_scale = 1.4

# 이미지 자동 검사(D-0036, D-0037). 배경 사진·완성 이미지를 비전 모델이 기준표로 검사하고 고친다.
# 판정 모델은 이미지 생성(codex_image = gpt 계열)과 다른 계열이어야 한다(D-0010).
# 실제 이미지 공급자를 쓰면서 이 절이 없으면 S4a·S4는 실행 전에 거절한다. 중계의 이미지 입력 지원은 Q-0020.
[providers.vision]
adapter = "openai_compat"
base_url = "http://127.0.0.1:10100/v1"
model = "google-antigravity/gemini-3.1-pro"
api_key_env = "ACF_TEXT_API_KEY"

[stages.image_qa]
enabled = true
max_fix_rounds = 2   # 수정 최대 2회(시도 3번). 배경 사진 9장이면 이미지 최대 27회, 판정 최대 54회
fix_mode = "edit"    # edit: 직전 이미지를 참조로 고친다 / regenerate: 처음부터 다시
allow_same_family = false


# 워크숍 웹앱(python -m acf.web, LLD §6.5). 모두 선택이며 없으면 기본값이다. 로그인 없음.
[web]
host = "127.0.0.1"
port = 8765
jobs_dir = "work/web-jobs"   # 작업 기록. Git 밖
sse_heartbeat_s = 15
default_until = "G6"         # POST /api/jobs에서 until을 생략할 때
