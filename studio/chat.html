<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대화 테스트 · Foundry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236e56cf'/%3E%3Cpath d='M8.5 17V7h7.5M8.5 12h5' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16.4' cy='16.4' r='1.7' fill='white'/%3E%3C/svg%3E">
<script>
  // 진행 화면과 같은 저장 테마를 먼저 적용해 깜빡임을 막는다. 값이 없으면 운영체제 설정을 따른다.
  (function () { try { var t = localStorage.getItem('fd-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-fd-theme', t); } catch (e) {} })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="shared/foundry-tokens.css">
<link rel="stylesheet" href="shared/flow.css">
<link rel="stylesheet" href="shared/chat.css">
</head>
<body class="fl ch">
<a class="ch-skip" href="#ch-input">입력 칸으로 건너뛰기</a>
<div class="fd-shell">
  <aside class="fd-side" data-side aria-label="탐색"></aside>
  <div class="fd-main">
    <header class="fd-head" data-top></header>
    <div class="ch-body">
      <main class="ch-stage" data-stage aria-labelledby="ch-title">
        <div class="ch-call" data-call></div>
        <div class="ch-state" data-state hidden></div>
        <div class="ch-bar" data-playbar hidden></div>
        <ol class="ch-list" data-list aria-label="대화" hidden></ol>
        <form class="ch-composer" data-composer hidden>
          <label class="sr" for="ch-input">보낼 말</label>
          <div class="ch-box">
            <textarea id="ch-input" data-input rows="1" autocomplete="off" spellcheck="false" aria-describedby="ch-hint"></textarea>
            <button type="submit" class="btn pri ch-send" data-send data-mode="send" aria-label="보내기" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><polyline points="13 6 19 12 13 18"/></svg><span>보내기</span></button>
          </div>
          <p class="ch-hint" id="ch-hint" data-composer-hint>Enter로 보내고 Shift+Enter로 줄을 바꿔요</p>
        </form>
        <p class="sr" data-live aria-live="polite" aria-atomic="true"></p>
      </main>
      <aside class="ch-panel" data-panel aria-label="상황 재생과 받아 둔 답" hidden></aside>
    </div>
  </div>
</div>
<script src="shared/chat.js"></script>
<script>
  window.characterChat = window.CharacterChat.mount({ root: document, apiBase: '' });
</script>
</body>
</html>
