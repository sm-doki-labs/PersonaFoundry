<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 공장 · A 시네마틱 다크 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="shared/base.css">
<style>
.theme-studio{
  --bg:#0a0a0c;--surface:#121215;--surface-2:#19191d;--surface-3:#222227;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --text:#ededf0;--muted:#8b8b94;--faint:#5c5c64;
  --accent:#f5a623;--accent-ink:#1c1304;--accent-soft:rgba(245,166,35,.14);
  --stamp:#f5a623;--stamp-bg:rgba(10,10,12,.55);--ready:rgba(245,166,35,.55);--pop:rgba(245,166,35,.7);--ok:#4ade80;
  --radius-card:14px;--gap:18px;--tall-max:44vh;--toast-top:72px;--toast-bottom:auto;--toast-from:-12px;
  --font-body:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
.theme-studio{background:radial-gradient(1200px 600px at 55% -10%,rgba(245,166,35,.06),transparent 60%),var(--bg)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 340px;grid-template-rows:60px minmax(0,1fr);height:100dvh;min-height:700px}

/* 상단 */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:216px}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.brand-mark .ic{width:18px;height:18px}
.brand-name{font-weight:700;letter-spacing:-.01em}
.brand-kr{font-size:12px;color:var(--muted)}
.char-pill{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px 0 4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.char-pill .avatar{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--surface-3);color:var(--faint)}
.char-pill .avatar .slot-empty .ic{width:14px;height:14px}
.char-pill [data-slot=name]{font-weight:600}
.char-pill .pill-state{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.char-pill .pill-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.progress-wrap{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.progress{width:140px;height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.btn--sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}

/* 공정 단계 */
.rail{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.rail-title{font-size:12px;color:var(--faint);padding:0 10px 10px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rail-item{position:relative;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;color:var(--muted);transition:background 300ms,color 300ms}
.rail-item:not(:last-child)::after{content:"";position:absolute;left:26px;top:45px;width:2px;height:12px;border-radius:2px;background:var(--line-2)}
.rail-item.is-done:not(:last-child)::after{background:var(--accent)}
.rail-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);transition:background 300ms,color 300ms,box-shadow 300ms}
.rail-label{display:block;font-weight:600;font-size:14px}
.rail-sub{display:block;font-size:12px;color:var(--faint)}
.rail-num{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.rail-item.is-current{background:var(--surface-2);color:var(--text)}
.rail-item.is-current .rail-icon{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 0 4px var(--accent-soft),0 8px 24px -6px rgba(245,166,35,.6)}
.rail-item.is-done{color:var(--text)}
.rail-item.is-done .rail-icon{color:var(--accent);border-color:rgba(245,166,35,.35);background:var(--accent-soft)}
.rail-item.is-locked{opacity:.5}
.rail-foot{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.rail-foot .dots{display:flex;gap:3px}
.rail-foot .dots i{width:6px;height:6px;border-radius:2px;background:var(--surface-3)}
.rail-foot .dots i:nth-child(-n+4){background:var(--ok)}

/* 작업 영역 */
.stage{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
.stage-body{overflow:auto;padding:30px 40px 24px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:var(--surface-3) transparent}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.kicker::before{content:"";width:16px;height:2px;border-radius:2px;background:var(--accent)}
.title{font-size:30px;font-weight:750;letter-spacing:-.025em;line-height:1.25;margin-top:8px}
.desc{color:var(--muted);max-width:62ch;margin-top:6px}
.agent-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:12px}
.agent{height:28px;padding:0 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
.judge{color:var(--muted)}
.judge::before{content:"판정 ";color:var(--accent);font-weight:600}
.cands--text{align-items:stretch}
.context{display:flex;flex-wrap:wrap;gap:10px}
.seed,.situation{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seed-label,.sit-label{font-size:12px;color:var(--faint);margin-right:2px}
.seed-chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.situation{padding:8px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid rgba(245,166,35,.25)}
.situation .sit-label{color:var(--accent);font-weight:600}
.sit-text{font-weight:600}

/* 후보 카드: 캐릭터 선택창 */
.cand-media{border-radius:var(--radius-card);background:var(--surface-2);box-shadow:0 0 0 1px var(--line);transition:box-shadow 280ms var(--ease-out)}
.cand-media::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45));pointer-events:none}
@media (hover:hover){.cand:hover .cand-media{box-shadow:0 0 0 1px var(--line-2),0 18px 40px -20px rgba(0,0,0,.8)}}
.cand.is-selected .cand-media{box-shadow:0 0 0 2px var(--accent),0 0 0 6px var(--accent-soft),0 28px 70px -20px rgba(245,166,35,.55)}
.cand-num{left:10px;top:10px;width:26px;height:26px;border-radius:8px;background:rgba(10,10,12,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.cand.is-selected .cand-num{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.cand-badge{right:10px;top:10px;height:26px;padding:0 9px;border-radius:8px;background:rgba(10,10,12,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--accent);border:1px solid rgba(245,166,35,.35)}
.cand--image .cand-check{right:10px;bottom:10px}
.cand-body{padding:12px 2px 0}
.cand-title{font-weight:650;font-size:15px}
.cand-desc{font-size:13px;color:var(--muted)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.cand--text{gap:12px;padding:18px;border-radius:var(--radius-card);background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);transition:transform 280ms var(--ease-out),opacity 280ms,filter 280ms,border-color 280ms,box-shadow 280ms;overflow:hidden}
.cand--text.is-selected{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 28px 60px -24px rgba(245,166,35,.5)}
.cand--text .cand-num{width:26px;height:26px;border-radius:8px;background:var(--surface-3);border:0;backdrop-filter:none}
.cand-name{font-size:21px;font-weight:750;letter-spacing:-.02em}
.cand-mbti{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--muted);letter-spacing:.04em}
.cand--text .cand-desc{font-size:14px;color:var(--text);opacity:.85}
.cand-move{padding:12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.cand-move-label{font-size:11px;font-weight:600;color:var(--accent)}
.cand-move-text{font-size:13.5px;line-height:1.55}
.cand-quote{font-size:14px;color:var(--text);padding-left:12px;border-left:2px solid var(--accent)}
.cand-quote::before{content:"“"}.cand-quote::after{content:"”"}
.cand--text.is-custom .cand-name{color:var(--accent)}

.presets{display:flex;gap:8px}
.preset{height:34px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);transition:all 160ms}
.preset.is-active{background:var(--accent-soft);border-color:rgba(245,166,35,.45);color:var(--accent)}
.cand--chip{height:44px;padding:0 16px 0 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);transition:background 160ms,border-color 160ms,color 160ms,transform 160ms}
.cand--chip.is-selected{background:var(--accent-soft);border-color:rgba(245,166,35,.5);color:var(--text)}

.tweaks-label{color:var(--faint)}
.tweak{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.tweak[aria-pressed=true]{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.write textarea{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);color:var(--text)}
.write textarea::placeholder{color:var(--faint)}

/* 하단 동작 */
.actionbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 40px;border-top:1px solid var(--line);background:rgba(10,10,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hint{font-size:13px;color:var(--faint);transition:color 200ms}
.hint.is-selected{color:var(--text);font-weight:600}
.actions{display:flex;gap:10px}
.btn{border-radius:11px}
.btn--ghost{background:var(--surface-2);border:1px solid var(--line-2);color:var(--text)}
@media (hover:hover){.btn--ghost:hover{background:var(--surface-3)}}
.btn--ghost.is-active{border-color:var(--accent);color:var(--accent)}
.btn--primary{background:var(--accent);color:var(--accent-ink);min-width:168px;box-shadow:0 10px 30px -10px rgba(245,166,35,.6)}
@media (hover:hover){.btn--primary:not(:disabled):hover{background:#ffb53d}}
.btn--primary:disabled{box-shadow:none}

/* 캐릭터 카드 */
.sheet{border-left:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--faint)}
.sheet-head strong{font-size:13px;color:var(--text);font-weight:600}
.meter{height:3px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.meter span{display:block;height:100%;width:var(--p,0%);background:var(--accent);transition:width 700ms var(--ease-out)}
.card{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#18181c,#0f0f12);border:1px solid var(--line-2);box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(245,166,35,.55),transparent 35%,transparent 70%,rgba(255,255,255,.18));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
.card-portrait{aspect-ratio:4/4.4;background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--surface-2) 10px 20px);color:var(--faint)}
.card-portrait.is-filled::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,#121215);pointer-events:none}
.card-profile{padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;margin-top:-44px;position:relative;z-index:2}
.card-name{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--faint);transition:color 300ms}
.card-name.is-filled{color:var(--text)}
.card-meta{font-size:12px;color:var(--muted)}
.card-tagline{font-size:13px;color:var(--faint);line-height:1.5}
.card-tagline.is-filled{color:var(--text);opacity:.85}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.card-tags .tag{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.film{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:16px 12px;background:#060607;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.film::before,.film::after{content:"";position:absolute;left:8px;right:8px;height:5px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 6px,transparent 6px 12px);border-radius:1px}
.film::before{top:5px}.film::after{bottom:5px}
.ch{aspect-ratio:9/16;border-radius:4px;overflow:hidden;background:var(--surface);color:var(--faint);border:1px dashed var(--line-2)}
.ch.is-filled{border:0}
.ch .slot-empty span{font-size:10px}
.card-motion{display:flex;align-items:center;justify-content:center;height:58px;padding:0 16px;color:var(--faint)}
.card-motion .slot-empty{flex-direction:row}
.card-motion.is-filled{justify-content:flex-start;color:var(--text)}
.card-motion .slot-big{color:var(--accent)}
.sheet-note{font-size:12px;color:var(--faint);line-height:1.5}

.toast{background:var(--surface-3);border:1px solid var(--line-2);border-radius:12px;color:var(--text);box-shadow:0 20px 50px -20px #000}
.toast-undo{border-radius:8px;background:var(--surface-2);color:var(--accent)}

/* 완료 */
.finale{background:rgba(5,5,6,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.finale-card{display:grid;grid-template-columns:320px 380px;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 0 0 6px var(--accent-soft),0 60px 120px -30px rgba(245,166,35,.35)}
.finale-media{position:relative;overflow:hidden}
.finale-media img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/5}
.finale-media::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-130%)}
.finale.is-open .finale-media::after{animation:shine 1200ms 500ms var(--ease-out) forwards}
.finale-body{padding:32px 30px;display:flex;flex-direction:column;gap:14px}
.finale-body h2{font-size:38px;font-weight:800;letter-spacing:-.03em}
.finale-tagline{color:var(--muted);font-size:14px}
.finale-stats li{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.finale-stats span{color:var(--faint)}
.finale-stats strong{color:var(--accent)}
.finale-next{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.finale-frame{border-radius:8px}
.finale-card{grid-template-columns:340px 420px}
.finale-actions{display:flex;gap:10px;margin-top:auto}

@media (max-width:1180px){
  .app{grid-template-columns:76px minmax(0,1fr) 300px}
  .rail-text,.rail-num,.rail-title,.rail-foot span{display:none}
  .rail-item{grid-template-columns:34px}
  .brand{min-width:0}.brand-kr{display:none}
  .stage-body{padding:24px}.actionbar{padding:12px 24px}
}
</style>
</head>
<body class="theme-studio">
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><i data-icon="aperture"></i></span><span class="brand-name">Character Factory</span><span class="brand-kr">캐릭터 공장</span></div>
    <span class="char-pill"><span class="avatar" data-slot="avatar"></span><span data-slot="name"></span><span class="pill-state">제작 중</span></span>
    <div class="top-right">
      <div class="progress-wrap"><span data-progress-text></span><span class="progress"><span data-progress-bar></span></span></div>
      <button type="button" class="btn btn--ghost btn--sm"><i data-icon="plus"></i>새 캐릭터</button>
    </div>
  </header>

  <nav class="rail" aria-label="공정 단계">
    <div><div class="rail-title">공정</div><ol data-rail></ol></div>
    <div class="rail-foot"><span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></span><span>에이전트 10명 · 4명 작업 완료</span></div>
  </nav>

  <main class="stage">
    <div class="stage-body" data-stage-body>
      <div>
        <p class="kicker" data-kicker></p>
        <h1 class="title" data-title></h1>
        <p class="desc" data-desc></p>
        <div class="agent-row"><span class="agent" data-agent></span><span class="judge" data-judge></span></div>
      </div>
      <div class="context"><div class="seed" data-seed hidden></div><div class="situation" data-situation hidden></div></div>
      <div class="presets" data-presets hidden></div>
      <div class="cands" data-cands></div>
      <div class="tweaks" data-tweaks></div>
      <div class="write" data-write><div><div class="write-inner"><textarea data-write-input rows="2" aria-label="직접 쓰기"></textarea><button type="button" class="btn btn--ghost" data-write-submit><i data-icon="send"></i>추가</button></div></div></div>
    </div>
    <div class="actionbar">
      <span class="hint" data-hint></span>
      <div class="actions">
        <button type="button" class="btn btn--ghost" data-write-toggle aria-expanded="false"><i data-icon="pencil"></i>직접 쓰기</button>
        <button type="button" class="btn btn--ghost" data-regen><i data-icon="refresh"></i><span class="btn-label">다시 만들기</span></button>
        <button type="button" class="btn btn--primary" data-confirm disabled><span class="btn-label">이걸로 확정</span><i data-icon="arrow"></i></button>
      </div>
    </div>
  </main>

  <aside class="sheet" aria-label="캐릭터 카드">
    <div class="sheet-head"><strong>캐릭터 카드</strong><span data-sheet-count></span></div>
    <div class="meter"><span data-sheet-meter style="width:var(--p,0%)"></span></div>
    <div class="card">
      <div class="card-portrait" data-slot="portrait"></div>
      <div class="card-profile" data-slot="profile">
        <div class="card-name" data-slot="name"></div>
        <div class="card-meta" data-slot="meta"></div>
        <p class="card-tagline" data-slot="tagline"></p>
        <div class="card-tags" data-slot="tags"></div>
      </div>
      <div class="film"><div class="ch" data-slot="ch1"></div><div class="ch" data-slot="ch2"></div><div class="ch" data-slot="ch3"></div></div>
      <div class="card-motion" data-slot="motion"></div>
    </div>
    <p class="sheet-note">관문에서 고른 결과가 이 카드에 차례로 모여요. 카드가 다 차면 페르소나와 학습 단계로 넘어가요.</p>
  </aside>
</div>

<div class="finale" data-finale hidden role="dialog" aria-modal="true" aria-labelledby="finale-name">
  <div class="finale-card">
    <div class="finale-media"><img data-finale-img alt=""></div>
    <div class="finale-body">
      <p class="kicker">1차 조립 완료</p>
      <h2 id="finale-name" data-finale-name></h2>
      <p class="finale-tagline" data-finale-tagline></p>
      <ul class="finale-stats" data-finale-stats></ul>
      <div class="finale-frames" data-finale-frames></div>
      <p class="finale-next" data-finale-next></p>
      <div class="finale-actions"><button type="button" class="btn btn--ghost" data-undo><i data-icon="undo"></i>되돌리기</button><button type="button" class="btn btn--primary" data-reset>처음부터 다시 보기<i data-icon="arrow"></i></button></div>
    </div>
  </div>
</div>
<script src="shared/data.js"></script>
<script src="shared/engine.js"></script>
</body>
</html>
