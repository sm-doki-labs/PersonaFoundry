<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 공장 · C 리퀴드 글래스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/glass.css">
<style>
.theme-glass{
  --stamp:var(--solid);--stamp-bg:rgba(0,0,0,.28);--ready:rgba(207,211,218,.3);--pop:rgba(207,211,218,.4);
  --radius-card:22px;--gap:18px;--tall-max:44vh;--toast-bottom:104px;
}

.app{position:relative;z-index:1;display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:64px auto minmax(0,1fr) auto;gap:14px;height:100dvh;min-height:700px;padding:16px}

/* 상단 */
.stagebar{grid-column:2;display:flex;align-items:center;gap:14px;padding:0 4px 0 18px;min-width:0}
.stage-prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.rail ol{list-style:none;margin:0;padding:0;display:flex;gap:2px}
.rail-item{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 4px;border-radius:999px;color:var(--faint);font-size:14px;transition:background 400ms var(--ease-out),color 400ms}
.rail-icon{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08)}
.rail-icon .ic{width:15px;height:15px}
.rail-sub,.rail-num{display:none}
.rail-label{font-weight:600}
.rail-item.is-current{background:rgba(255,255,255,.08);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.rail-item.is-current .rail-icon{background:var(--solid);color:var(--solid-ink)}
.rail-item + .rail-item::before{content:"";width:10px;height:1px;background:var(--line-2);margin-left:-6px;margin-right:-1px}
.rail-item.is-done{color:var(--text)}
.rail-item.is-done .rail-icon{background:var(--ok-soft);color:var(--ok)}
.progress{width:120px;height:4px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}

/* 캐릭터 카드 */
.sheet{grid-row:2/5;border-radius:var(--r-panel);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;scrollbar-width:none}
.portrait{aspect-ratio:4/4.6;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.2);border:1px dashed var(--line-2);color:var(--faint)}
.portrait.is-filled{border:0;box-shadow:0 20px 40px -20px rgba(0,0,0,.7)}
.profile{padding:0 6px;display:flex;flex-direction:column;gap:4px}
.p-name{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--faint)}
.p-name.is-filled{color:var(--text)}
.p-meta{font-size:12px;color:var(--muted)}
.p-tagline{font-size:13px;line-height:1.5;color:var(--faint)}
.p-tagline.is-filled{color:var(--muted)}
.p-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.p-tags .tag{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line)}
.chs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.18);border:1px dashed var(--line-2);color:var(--faint)}
.ch.is-filled{border:0}
.ch .slot-empty span{font-size:var(--fs-2xs)}
.motion{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.08);color:var(--faint);padding:0 14px}
.motion .slot-empty{flex-direction:row}
.motion.is-filled{justify-content:flex-start;color:var(--text)}

/* 작업 영역 */
.stage{min-height:0;min-width:0;overflow:auto;padding:14px 18px 6px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.linked-note{margin:0 0 10px;font-size:12.5px;color:var(--warn)}
.kicker{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.title{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:12px;}
.desc{color:var(--muted);max-width:60ch;margin-top:8px}
.agent-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px}
.agent{height:30px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.agent[data-state=working] .agent-dot{background:var(--solid)}
.judge{color:var(--muted)}
.judge::before{content:"판정 · ";color:var(--text);font-weight:600}
.context{display:flex;flex-wrap:wrap;gap:10px}
.seed,.situation{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seed-label,.sit-label{font-size:12px;color:var(--faint);margin-right:2px}
.situation{padding:8px 16px;border-radius:999px;background:var(--solid);color:var(--solid-ink)}
.situation .sit-label{color:rgba(21,23,28,.7);font-weight:600}
.sit-text{font-weight:700}

.cand-media{border-radius:var(--radius-card);box-shadow:0 0 0 0 transparent,0 30px 60px -30px rgba(0,0,0,.75);transition:box-shadow 300ms var(--ease-out)}
.cand.is-selected .cand-media{box-shadow:0 0 0 2px var(--solid),0 0 0 0 transparent,0 30px 80px -20px rgba(0,0,0,.32)}
.cand-shine{background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%)}
.cand-num{left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:rgba(20,20,28,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25)}
.cand.is-selected .cand-num{background:var(--solid);color:var(--solid-ink)}
.cand-badge{left:46px;top:12px;height:28px;padding:0 10px;border-radius:999px;background:rgba(20,20,28,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25)}
.cand--image .cand-check{right:12px;top:12px}
.cand--image{position:relative}
.cand--image .cand-body{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;padding:10px 12px;border-radius:15px;background:rgba(18,18,26,.34);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.18);transition:transform 300ms var(--ease-out)}
.cands--square .cand-tags{display:none}
.cand-title{font-weight:700;font-size:15px}
.cand-desc{font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12)}

.cands--text{align-items:stretch}
.cand--text{gap:12px;padding:20px;border-radius:var(--radius-card);background:var(--glass-bg);border:1px solid var(--line);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 24px 50px -26px rgba(0,0,0,.6);overflow:hidden;transition:transform 300ms var(--ease-out),opacity 300ms,filter 300ms,background 300ms,border-color 300ms,box-shadow 300ms}
.cand--text.is-selected{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.12));border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 0 transparent,0 30px 70px -26px rgba(0,0,0,.32)}
.cand--text .cand-num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);border:0;backdrop-filter:none}
.cand-name{font-size:22px;font-weight:800;letter-spacing:-.02em}
.cand-mbti{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.14);letter-spacing:.05em}
.cand--text .cand-desc{font-size:14px;color:var(--text);opacity:.88}
.cand-move{padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08)}
.cand-move-label{font-size:11px;font-weight:600;color:var(--faint)}
.cand-move-text{font-size:13.5px;line-height:1.55}
.cand-quote{font-size:14px;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--solid);color:var(--solid-ink);align-self:flex-start}

.presets{display:flex;gap:8px}
.cand--chip{height:46px;padding:0 18px 0 12px;border-radius:999px;background:var(--glass-bg);border:1px solid var(--line);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);font-weight:600;font-size:14px;transition:background 200ms,color 200ms,box-shadow 200ms}
.cand--chip.is-selected{background:var(--solid);color:var(--solid-ink);box-shadow:0 8px 30px -10px rgba(0,0,0,.32)}
.cand--chip.is-selected .chip-box{background:var(--solid-ink);border-color:var(--solid-ink);color:var(--text)}

.tweaks-label{color:var(--faint)}
.write textarea{padding:14px 16px;border-radius:18px;background:rgba(0,0,0,.25);border:1px solid var(--line-2);color:var(--text);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.write textarea::placeholder{color:var(--faint)}

/* 하단 독 */
.dock .btn--primary{min-width:170px}
.dock{grid-column:2;justify-self:center;width:min(100%,880px);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 10px 10px 22px;border-radius:999px}
.hint{font-size:var(--fs-xs);color:var(--faint)}
.hint.is-selected{color:var(--text);font-weight:600}
.actions{display:flex;gap:8px}
[data-regen].has-tweaks{background:rgba(255,255,255,.22);border-color:var(--solid);color:var(--text)}

.toast{border-radius:999px;background:rgba(20,20,28,.45);border:1px solid var(--line-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);color:var(--text);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.toast-undo{border-radius:999px;background:rgba(255,255,255,.14)}

.fly-ghost{border-radius:20px}

/* 완료 */
.finale{background:rgba(5,5,10,.35);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.finale-card{display:grid;grid-template-columns:340px 400px;gap:24px;padding:20px;border-radius:34px;background:var(--glass-bg);border:1px solid var(--line-2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 60px 120px -40px rgba(0,0,0,.7)}
.finale-media{position:relative;border-radius:24px;overflow:hidden}
.finale-media img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/5}
.finale-media::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-130%)}
.finale.is-open .finale-media::after{animation:shine 1300ms 500ms var(--ease-out) forwards}
.finale-body{display:flex;flex-direction:column;gap:14px;padding:8px 4px}
.finale-body .kicker{margin:0}
.finale-body h2{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.finale-tagline{color:var(--muted);font-size:14px}
.finale-stats li{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.finale-stats span{color:var(--faint)}
.finale-frame{border-radius:12px}
.finale-next{font-size:13px;color:var(--muted)}
.finale-actions{display:flex;gap:8px;margin-top:auto}

@media (max-width:1240px){.app{grid-template-columns:270px minmax(0,1fr)}.brand small{display:none}.rail-label{display:none}.rail-item{padding:0 6px}.rail-item.is-current .rail-label{display:inline}.rail-item.is-current{padding-right:14px}}
</style>
</head>
<body class="theme-glass">
<div class="ambient" aria-hidden="true"><div class="amb"></div><div class="amb"></div><div class="amb-veil"></div></div>
<div class="app">
  <header class="topbar appbar glass">
    <div class="brand"><span class="brand-mark"><i data-icon="aperture"></i></span>Character Factory <small>캐릭터 공장</small></div>
    <nav class="pills" aria-label="화면"><a class="pill-tab" href="d-ops.html#chars" data-chars-tab>캐릭터</a><a class="pill-tab is-active" href="c-glass.html" aria-current="page" data-workroom-tab>작업실<span class="tab-badge num" data-workroom-count></span></a></nav>
    <nav class="crumbs" data-crumbs aria-label="위치"></nav>
    <div class="top-right">
      <button type="button" class="icon-btn" data-bell aria-label="알림" aria-haspopup="dialog" aria-expanded="false" aria-controls="appbar-notes"><i data-icon="bell"></i><span class="badge num" data-bell-count></span></button>
      <span class="me" title="워크스페이스 relationship-quest"><span class="me-av">나</span><span class="me-text"><b>기획자</b><small>relationship-quest</small></span></span>
    </div>
  </header>
  <div class="stagebar"><nav class="rail" aria-label="공정 단계"><ol data-rail></ol></nav><span class="stage-prog"><span data-progress-text></span><span class="progress"><span data-progress-bar></span></span></span></div>

  <aside class="sheet glass" aria-label="캐릭터 카드">
    <div class="panel-head"><h2>캐릭터 카드</h2><span class="count" data-sheet-count></span></div>
    <div class="portrait" data-slot="portrait"></div>
    <div class="profile" data-slot="profile">
      <div class="p-name" data-slot="name"></div>
      <div class="p-meta" data-slot="meta"></div>
      <p class="p-tagline" data-slot="tagline"></p>
      <div class="p-tags" data-slot="tags"></div>
    </div>
    <div class="chs"><div class="ch" data-slot="ch1"></div><div class="ch" data-slot="ch2"></div><div class="ch" data-slot="ch3"></div></div>
    <div class="motion" data-slot="motion"></div>
  </aside>

  <main class="stage" data-stage-body>
    <div>
      <p class="linked-note" data-linked-note hidden></p>
      <p class="kicker" data-kicker></p>
      <h1 class="title" data-title></h1>
      <p class="desc" data-desc></p>
      <div class="agent-row"><span class="agent" data-agent></span><span class="judge" data-judge></span></div>
    </div>
    <div class="context"><div class="seed" data-seed hidden></div><div class="situation" data-situation hidden></div></div>
    <div class="presets" data-presets hidden></div>
    <div class="cands" data-cands></div>
    <div class="tweaks" data-tweaks></div>
    <div class="write" data-write><div><div class="write-inner"><textarea data-write-input rows="2" aria-label="직접 쓰기"></textarea><button type="button" class="btn btn--lg" data-write-submit><i data-icon="send"></i>추가</button></div></div></div>
  </main>

  <div class="dock glass actionbar">
    <span class="hint" data-hint></span>
    <div class="actions">
      <button type="button" class="btn btn--lg" data-write-toggle aria-expanded="false"><i data-icon="pencil"></i>직접 쓰기</button>
      <button type="button" class="btn btn--lg" data-regen><i data-icon="refresh"></i><span class="btn-label">다시 만들기</span></button>
      <button type="button" class="btn btn--lg btn--primary" data-confirm disabled><span class="btn-label">이걸로 확정</span><i data-icon="arrow"></i></button>
    </div>
  </div>
</div>

<div class="finale" data-finale hidden role="dialog" aria-modal="true" aria-labelledby="finale-name">
  <div class="finale-card">
    <div class="finale-media"><img data-finale-img alt=""></div>
    <div class="finale-body">
      <p class="kicker">1차 조립 완료</p>
      <h2 id="finale-name" data-finale-name></h2>
      <p class="finale-tagline" data-finale-tagline></p>
      <ul class="finale-stats" data-finale-stats></ul>
      <div class="finale-frames" data-finale-frames></div>
      <p class="finale-next" data-finale-next></p>
      <div class="finale-actions"><button type="button" class="btn btn--lg" data-undo><i data-icon="undo"></i>되돌리기</button><button type="button" class="btn btn--lg btn--primary" data-reset>처음부터 다시 보기<i data-icon="arrow"></i></button></div>
    </div>
  </div>
</div>
<div class="notes glass" id="appbar-notes" data-notes hidden role="dialog" aria-label="알림"><h3>알림</h3><ul data-notes-list></ul></div>
<script src="shared/appbar.js"></script>
<script src="shared/gates.js"></script>
<script src="shared/data.js"></script>
<script src="shared/engine.js"></script>
<script>
// 고른 사진의 색이 화면 전체 배경으로 번진다.
(function () {
  var layers = Array.prototype.slice.call(document.querySelectorAll('.amb'));
  var cur = 0, last = '';
  function setAmb(src) {
    if (!src || src === last) return;
    last = src;
    var next = layers[1 - cur];
    next.style.backgroundImage = 'url("' + src + '")';
    next.classList.add('is-on');
    layers[cur].classList.remove('is-on');
    cur = 1 - cur;
  }
  function stepImage(s) {
    if (s.kind !== 'image') return null;
    var c = s.candidates.filter(function (x) { return x.recommended; })[0] || s.candidates[0];
    return c ? c.img : null;
  }
  setAmb('assets/hero-b.jpg');
  document.addEventListener('factory:select', function (e) { setAmb(e.detail.img); });
  document.addEventListener('factory:step', function (e) { var img = stepImage(e.detail.step); if (img) setAmb(img); });
  document.addEventListener('factory:reset', function () { setAmb('assets/hero-b.jpg'); });
})();
</script>
<script>
// 상단 위치 표시: 캐릭터 › 이름 › 지금 처리하는 관문. 캐릭터 화면의 저장 상태가 있으면 그 이름과 얼굴을 쓴다.
(function () {
  var F = window.Factory, D = window.FACTORY_DATA;
  var q = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(location.search);
  var back = params.get('back') || 'd-ops.html#job/seoha-new';
  var ops = null;
  try { var raw = JSON.parse(localStorage.getItem('cf-ops-v4') || 'null'); ops = raw && raw.S; } catch (e) {}
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function who() {
    var st = F.state(), name = '', img = '';
    if (ops && params.get('gate')) return { name: ops.name || '새 캐릭터', img: ops.avatar ? 'assets/hero-b.jpg' : '' };
    var plan = D.steps.find(function (x) { return x.id === 'plan'; }), hero = D.steps.find(function (x) { return x.id === 'hero'; });
    if (!name && st.choices.plan) { var p = plan.candidates.find(function (c) { return c.id === st.choices.plan[0]; }); name = p ? p.name : '직접 쓴 안'; }
    if (!img && st.choices.hero) { var h = hero.candidates.find(function (c) { return c.id === st.choices.hero[0]; }); if (h) img = h.img; }
    return { name: name || '새 캐릭터', img: img };
  }
  function update() {
    var st = F.state(), s = D.steps[st.step], w = who();
    var av = w.img ? '<img src="' + w.img + '" alt="">' : esc(w.name.slice(0, 1));
    var last = s ? '<span class="crumb-gate"><code>' + esc(s.gate) + '</code>' + esc((window.FACTORY_GATE && window.FACTORY_GATE(s.gate) || {}).title || s.title) + '</span>' : '<span class="crumb-gate">1차 조립 완료</span>';
    q('[data-crumbs]').innerHTML = '<a href="d-ops.html#chars">캐릭터</a>' + F.icon('chevron', 'ic sep') + '<a class="crumb-char" href="d-ops.html#char/seoha"><span class="crumb-av">' + av + '</span><b>' + esc(w.name) + '</b></a>' + F.icon('chevron', 'ic sep') + last;
  }
  // 상단바 데이터: 캐릭터 화면이 저장한 상태(알림, 결재 대기 순서)를 그대로 읽는다
  function stored() { try { return JSON.parse(localStorage.getItem('cf-ops-v4') || 'null'); } catch (e) { return null; } }
  var provider = {
    notes: function () { var r = stored(); return (r && r.S && r.S.notes) || []; },
    unread: function () { var r = stored(); return (r && r.S && r.S.unread) || 0; },
    markRead: function () { var r = stored(); if (!r || !r.S) return; r.S.unread = 0; try { localStorage.setItem('cf-ops-v4', JSON.stringify(r)); } catch (e) {} },
    picks: function () { var r = stored(); return (r && r.picks) || []; },
    currentGate: function () { var s = D.steps[F.state().step]; return params.get('gate') && s ? s.gate : null; },
    back: function () { return back; }
  };
  function counts() { window.AppBar.init(provider); }
  window.addEventListener('storage', function (e) { if (e.key === 'cf-ops-v4') window.AppBar.render(); });
  document.addEventListener('factory:step', update);
  document.addEventListener('factory:finale', update);
  document.addEventListener('factory:reset', update);
  document.addEventListener('DOMContentLoaded', function () { update(); counts(); });
})();
</script>
</body>
</html>
