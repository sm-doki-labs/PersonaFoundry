[project]
name = "character-factory-poc"
version = "0.1.0"
description = "Agentic character factory: brief to release bundle with human gates"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    # 얼굴 크롭(D-0027). OpenCV 5에는 Haar 검출기가 없어 4.x로 고정한다.
    "opencv-python-headless>=4.8,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "boto3>=1.35,<2",
    # 시그니처 영상 배경 고정의 사람 분리 모델 실행기(D-0222). mediapipe 는 OpenCV 5 를 끌고 와 쓰지 않는다.
    "ai-edge-litert>=2.3,<3",
]

[project.scripts]
cfp = "character_factory_poc.cli:main"
cfp-compile-evidence = "character_factory_poc.stages.s8_prompts.evidence_compiler:main"

[project.optional-dependencies]
# grok_web 어댑터(D-0029, 기본 꺼짐). 기존 Chrome에 CDP로 붙으므로 브라우저 다운로드는 필요 없다.
web = ["playwright>=1.45,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
character_factory_poc = ["prompts/*.md", "prompts/review/*.md", "resources/*.json", "resources/*.md", "resources/*.tflite", "web/static/**/*"]

[tool.setuptools.data-files]
"share/character-factory-poc/studio" = ["studio/*.html"]
"share/character-factory-poc/studio/shared" = ["studio/shared/*.js", "studio/shared/*.css"]
"share/character-factory-poc/studio/assets" = ["studio/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# 한국어 안내문·HTML 템플릿 문자열은 포매터가 줄바꿈할 수 없으므로 해당 파일만 줄 길이를 면제한다.
[tool.ruff.lint.per-file-ignores]
"src/character_factory_poc/stages/export/preview.py" = ["E501"]
"src/character_factory_poc/stages/export/preview_scripts.py" = ["E501"]
"src/character_factory_poc/pipeline/gates.py" = ["E501"]
"src/character_factory_poc/pipeline/agent.py" = ["E501"]
"src/character_factory_poc/common/budget.py" = ["E501"]
"src/character_factory_poc/stages/s7_traits/sheet.py" = ["E501"]
"src/character_factory_poc/stages/s8_prompts/build.py" = ["E501"]
"src/character_factory_poc/stages/s1_reference/page.py" = ["E501"]
"src/character_factory_poc/stages/s1_reference/report.py" = ["E501"]
"src/character_factory_poc/stages/s1_reference/features.py" = ["E501"]
"src/character_factory_poc/stages/s2_hero/page.py" = ["E501"]
"src/character_factory_poc/stages/s4_frames/page.py" = ["E501"]
"src/character_factory_poc/stages/s5_intro/page.py" = ["E501"]
"src/character_factory_poc/providers/xai_video.py" = ["E501"]
"src/character_factory_poc/providers/grok_web.py" = ["E501"]
"src/character_factory_poc/providers/factory.py" = ["E501"]
"src/character_factory_poc/stages/s5_intro/run.py" = ["E501"]
"tests/test_video.py" = ["E501"]
"src/character_factory_poc/stages/s3_plan/check.py" = ["E501"]
